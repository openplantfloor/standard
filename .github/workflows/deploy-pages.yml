name: deploy-pages

# Serves https://schemas.openplantfloor.org/: every schema at the path its $id names, every edition
# record at its path, plus index.json and index.html. The site is built from the files the gate
# passed; nothing else in the repository is published. The custom domain is the repository's
# Pages setting (schemas.openplantfloor.org) with its DNS CNAME pointing at GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily: the served check also catches a host that stopped serving, or started answering
  # for paths the standard does not hold, between deploys.
  schedule:
    - cron: '41 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After every deploy, and daily: every staged file answers 200 with exactly the built bytes,
  # and a path the standard does not hold answers 404.
  served:
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run site
      # Pages' CDN can serve the previous build for a minute after a deploy: retry before failing.
      - run: for attempt in 1 2 3 4 5; do npm run served && exit 0; sleep 60; done; exit 1
